name: Production Deploy (Cloudflare Workers)

# Validate and build from the repository-root workspace. Publication remains
# guarded by both credentials and a configured production domain.
on:
  push:
    branches:
      - main
    paths:
      - "readme.md"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "circuit.config.ts"
      - "circuit/**"
      - "doc/**"
      - ".claude/skills/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "lefthook.yml"
      - "scripts/mdx-format.sh"
      - "scripts/schgen/**"
      - "boards/**"
      - "symbols/**"
      - "footprints/**"
      - ".github/workflows/**"

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-deploy:
    name: Build & deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history supplies the doc-history plugin's Created/Updated/Author data.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install root workspace
        run: pnpm install --frozen-lockfile

      - name: Strict project and package validation
        run: pnpm circuit:check

      - name: Host, CAD and model checks
        run: pnpm check

      - name: Build site
        env:
          ZUDO_DOC_BUILD_LOG: ${{ runner.temp }}/doc-build.log
        run: pnpm build

      - name: Built references, publication and links
        env:
          ZUDO_DOC_BUILD_LOG: ${{ runner.temp }}/doc-build.log
        run: pnpm check:site

      - name: Generated output is committed and deterministic
        run: pnpm circuit:check-generated

      - name: Evaluate deploy gate
        id: gate
        working-directory: doc
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          should=true
          reason=""
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            should=false
            reason="CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret(s) not set"
          elif grep -q 'REPLACE_ME' wrangler.toml; then
            should=false
            reason="wrangler.toml still has the REPLACE_ME domain placeholder"
          fi
          echo "should_deploy=$should" >> "$GITHUB_OUTPUT"
          if [ "$should" != "true" ]; then
            echo "::notice::Skipping Cloudflare deploy — $reason. Validation and build passed; the site was NOT published. Complete the go-live checklist in doc/CLAUDE.md to enable deploys."
          fi

      - name: Prepare deploy artifact
        if: steps.gate.outputs.should_deploy == 'true'
        working-directory: doc
        run: printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy to Cloudflare Workers (production)
        if: steps.gate.outputs.should_deploy == 'true'
        working-directory: doc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          n=0
          until [ "$n" -ge 3 ]; do
            npx wrangler@4 deploy --env production 2>&1 | tee deploy.log && break
            n=$((n + 1))
            echo "wrangler deploy failed (attempt $n/3); retrying in 10s..."
            sleep 10
          done
          [ "$n" -lt 3 ]
