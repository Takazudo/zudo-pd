# Single-purpose PD20 phase33 D1 reference extraction (#235, admitted wave 2 task W2-D).
# Re-runs only the 2 us refined nom/adv decks at the pinned solver identity with two appended
# output-only wrdata lines (RAMP and per-rail reference/clamp nodes; servo driver, feedback, FET
# source and integrator nodes for the pre-registered d1-servo-criteria.md). Every downloaded and derived
# input is hash-checked and fails closed; one bounded download attempt per TI archive.
# The run is adopted only if primary and supplemental waveforms are byte-identical to the
# retained 2026-11-09 refinement. Vendor model bytes are never uploaded; only their hashes.
# Opt-in gap_sensitivity (d1-gap-criteria.md) adds the eight pre-registered C1 gate-to-threshold variant
# cases, run only after the unmodified baseline pair reproduces; a model sensitivity, never a design change.
# Opt-in t2_evaluation (d1-t2-criteria.md) runs the enable-edge threshold corners, the inert control and the T2
# -12 V candidate decks the same way: a model evaluation of a candidate, never adoption.
# Opt-in t2_rev2_evaluation (d1-t2-rev2-criteria.md) runs the T2 rev 2 (a2) decks, its VF-spread, leakage-ladder
# and hot cases under the revised rules, then the labelled matched-variant ladder for pinned ABORTED cases only.
# Opt-in itl4_inertness (itl4-inertness-criteria.md) rebuilds the recorded T2 rev 2 pinned decks with only itl4 raised and
# compares every output with the recorded hashes: a solver-setting diagnostic that judges no candidate.
# Opt-in osc_bank (osc-bank-criteria.md) runs the unmodified baseline with the OSC bank at its fitted value and +/-20 %
# and measures slope, current and charge per rail: a diagnostic that judges nothing.
# Opt-in ceiling_corners (ceiling-corners-criteria.md) runs the e5 corners under the matched-variant ladder and a
# one-line .temp hot case at the contract ceiling bank, with the same measurements: a diagnostic that judges nothing.
# Opt-in variant_cross_check (variant-cross-check-criteria.md) reruns the identity pair under each matched-variant step and
# compares it with the same dispatch's pinned run: it reads solver-setting comparability only.
# Opt-in adv_rshunt_free (adv-rshunt-free-criteria.md) runs the identity adv deck at rshunt=1e10, pinned and under the
# abstol step: a diagnostic that judges no ceiling.
# Not a generic compute dispatcher: eight opt-in boolean inputs, no secrets, no write permission, no deploy.

name: Phase33 D1 reference extraction

on:
  workflow_dispatch:
    inputs:
      gap_sensitivity:
        description: Also run the eight pre-registered C1 gap-sensitivity variant cases (d1-gap-criteria.md)
        type: boolean
        default: false
      t2_evaluation:
        description: Also run the pre-registered T2 -12 V clamp evaluation and enable-edge corners (d1-t2-criteria.md)
        type: boolean
        default: false
      t2_rev2_evaluation:
        description: Also run the T2 rev 2 (a2) -12 V evaluation and variant ladder (d1-t2-rev2-criteria.md; only once pre-registered)
        type: boolean
        default: false
      itl4_inertness:
        description: Also run the itl4 inertness diagnostic on the recorded T2 rev 2 pinned decks (itl4-inertness-criteria.md)
        type: boolean
        default: false
      osc_bank:
        description: Also run the OSC-bank baseline diagnostic at the fitted bank and +/-20 % (osc-bank-criteria.md)
        type: boolean
        default: false
      ceiling_corners:
        description: Also run the ceiling-bank e5 corners and hot case diagnostic (ceiling-corners-criteria.md)
        type: boolean
        default: false
      variant_cross_check:
        description: Also rerun the identity pair under each matched variant and compare with pinned (variant-cross-check-criteria.md)
        type: boolean
        default: false
      adv_rshunt_free:
        description: Also run the identity adv deck at rshunt=1e10, pinned and under abstol (adv-rshunt-free-criteria.md)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase33-d1-reference
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    # 45 min covered the reference pair and the gap variants; the T2 evaluation adds 15 decks (about 2 min each);
    # T2 rev 2 adds 33 decks plus at most two variant-ladder steps.
    timeout-minutes: 300
    defaults:
      run:
        # Explicit bash enables pipefail, so the tee below cannot hide a runner failure.
        shell: bash
    env:
      PHASE33: manufacturing/sim/board-b20-phase33
      IMAGE: kicad/kicad@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      # Same pins as component-spec-skills.yml (checkout v5.0.1, setup-python v5.6.0).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Reject attempt 1 and rev 2 T2 in one dispatch (they share the t2 work tree and control gate)
        if: inputs.t2_evaluation && inputs.t2_rev2_evaluation
        run: |
          echo "::error::t2_evaluation and t2_rev2_evaluation are separate dispatches"
          exit 1
      - name: Reject the itl4 diagnostic combined with any other opt-in (it rebuilds the t2 work tree)
        if: inputs.itl4_inertness && (inputs.gap_sensitivity || inputs.t2_evaluation || inputs.t2_rev2_evaluation)
        run: |
          echo "::error::itl4_inertness is a separate dispatch"
          exit 1
      - name: Reject the OSC-bank diagnostic combined with any other opt-in
        if: inputs.osc_bank && (inputs.gap_sensitivity || inputs.t2_evaluation || inputs.t2_rev2_evaluation || inputs.itl4_inertness)
        run: |
          echo "::error::osc_bank is a separate dispatch"
          exit 1
      - name: Reject the ceiling-corners diagnostic combined with any other opt-in
        if: inputs.ceiling_corners && (inputs.gap_sensitivity || inputs.t2_evaluation || inputs.t2_rev2_evaluation || inputs.itl4_inertness || inputs.osc_bank)
        run: |
          echo "::error::ceiling_corners is a separate dispatch"
          exit 1
      - name: Reject the variant cross-check combined with any other opt-in
        if: inputs.variant_cross_check && (inputs.gap_sensitivity || inputs.t2_evaluation || inputs.t2_rev2_evaluation || inputs.itl4_inertness || inputs.osc_bank || inputs.ceiling_corners)
        run: |
          echo "::error::variant_cross_check is a separate dispatch"
          exit 1
      - name: Reject the rshunt-free adv diagnostic combined with any other opt-in
        if: inputs.adv_rshunt_free && (inputs.gap_sensitivity || inputs.t2_evaluation || inputs.t2_rev2_evaluation || inputs.itl4_inertness || inputs.osc_bank || inputs.ceiling_corners || inputs.variant_cross_check)
        run: |
          echo "::error::adv_rshunt_free is a separate dispatch"
          exit 1
      - name: Prepare hash-verified inputs (one bounded TI download each)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 "$PHASE33/extract_reference.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/manifest.json"
      - name: Pull the solver image by digest
        run: docker pull "$IMAGE"
      - name: Run nom adv once with the pinned runner (original-only)
        run: |
          python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/tracking" nom adv --original-only 2>&1 | tee "$RUNNER_TEMP/out/runner-output.txt"
      - name: Identity control against the retained refinement
        id: identity
        run: |
          python3 "$PHASE33/extract_reference.py" identity "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/manifest.json" --output "$RUNNER_TEMP/out/identity.json"
      - name: Reference analysis (only when reproduced)
        if: steps.identity.outcome == 'success'
        run: |
          python3 "$PHASE33/extract_reference.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/analysis.json"
      - name: Gap sensitivity variants (only when requested and reproduced)
        if: inputs.gap_sensitivity && steps.identity.outcome == 'success'
        run: |
          python3 "$PHASE33/gap_sensitivity.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/gap-manifest.json"
          # Amendment 1: a case that aborts is recorded (ABORTED) and its rail stops; the other rail and analyze continue.
          for label in g20 g16 g12 worst; do
            cases=$(python3 "$PHASE33/gap_sensitivity.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: no rail left to run"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/gaps/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/gap-runner-$label.txt"; then
              # Only a solver abort is tolerated; any other runner failure fails the step.
              python3 "$PHASE33/gap_sensitivity.py" check-run "$RUNNER_TEMP/work" "$label"
              echo "::warning::$label recorded an ABORTED case; its rail stops and is not retried in this dispatch"
            fi
          done
          python3 "$PHASE33/gap_sensitivity.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/gap-sensitivity.json"
      - name: T2 evaluation (only when requested and reproduced)
        # Independent of the gap step: a gap failure must not silently skip T2.
        if: ${{ !cancelled() && inputs.t2_evaluation && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/t2_clamp.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/t2-manifest.json"
          # T2 labels run only after the inert control reproduces the D1 failure; aborts are recorded, never retried.
          for label in base e12lo e12hi e5lo e5hi ctrl t2 t2lo t2hi t2load; do
            cases=$(python3 "$PHASE33/t2_clamp.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: not run (control gate)"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/t2/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/t2-runner-$label.txt"; then
              python3 "$PHASE33/t2_clamp.py" check-run "$RUNNER_TEMP/work" "$label"
              echo "::warning::$label recorded an ABORTED case; it is not retried in this dispatch"
            fi
          done
          python3 "$PHASE33/t2_clamp.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/t2-evaluation.json"
      - name: T2 rev 2 evaluation (only when requested and reproduced)
        if: ${{ !cancelled() && inputs.t2_rev2_evaluation && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/t2_rev2.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/t2r2-manifest.json"
          # Labels run only after the inert control reproduces the D1 failure; pinned aborts are recorded, not retried.
          labels=$(python3 "$PHASE33/t2_rev2.py" labels)
          [ -n "$labels" ] || { echo "::error::no T2 rev 2 labels"; exit 1; }
          for label in $labels; do
            cases=$(python3 "$PHASE33/t2_rev2.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: not run (control gate)"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/t2/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/t2r2-runner-$label.txt"; then
              python3 "$PHASE33/t2_rev2.py" check-run "$RUNNER_TEMP/work" "$label"
              echo "::warning::$label recorded an ABORTED case; it enters the labelled variant ladder only"
            fi
          done
          python3 "$PHASE33/t2_rev2.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/t2r2-evaluation.json"
          # Matched-variant ladder (VARIANT-EVALUATED, never PASS or FAIL): pinned ABORTED cases and the cross-check.
          for step in 1 2; do
            python3 "$PHASE33/t2_rev2.py" variant-plan "$RUNNER_TEMP/work" "$step" > "$RUNNER_TEMP/out/t2r2-plan-$step.txt"
            while read -r label names; do
              [ -n "$label" ] || continue
              if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/t2/$label/tracking" $names --original-only 2>&1 | tee "$RUNNER_TEMP/out/t2r2-runner-$label.txt"; then
                python3 "$PHASE33/t2_rev2.py" check-run "$RUNNER_TEMP/work" "$label"
              fi
            done < "$RUNNER_TEMP/out/t2r2-plan-$step.txt"
          done
          python3 "$PHASE33/t2_rev2.py" variant-analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/t2r2-variants.json"
      - name: itl4 inertness diagnostic (only when requested and reproduced)
        if: ${{ !cancelled() && inputs.itl4_inertness && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/t2_rev2.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/t2r2-manifest.json"
          python3 "$PHASE33/itl4_inertness.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/itl4-manifest.json"
          labels=$(python3 "$PHASE33/itl4_inertness.py" labels)
          [ -n "$labels" ] || { echo "::error::no itl4 labels"; exit 1; }
          # Every deck runs once; an abort is recorded, never retried.
          for label in $labels; do
            cases=$(python3 "$PHASE33/itl4_inertness.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: nothing pending"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/itl4/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/itl4-runner-$label.txt"; then
              python3 "$PHASE33/itl4_inertness.py" check-run "$RUNNER_TEMP/work" "$label"
            fi
          done
          python3 "$PHASE33/itl4_inertness.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/itl4-inertness.json"
      - name: OSC-bank baseline diagnostic (only when requested and reproduced)
        if: ${{ !cancelled() && inputs.osc_bank && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/osc_bank.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/bank-manifest.json"
          labels=$(python3 "$PHASE33/osc_bank.py" labels)
          [ -n "$labels" ] || { echo "::error::no osc_bank labels"; exit 1; }
          # Pinned first; an abort is recorded and enters only the labelled matched-variant ladder below.
          for label in $labels; do
            cases=$(python3 "$PHASE33/osc_bank.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: nothing pending"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/bank/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/bank-runner-$label.txt"; then
              python3 "$PHASE33/osc_bank.py" check-run "$RUNNER_TEMP/work" "$label"
            fi
          done
          for step in 1 2; do
            python3 "$PHASE33/osc_bank.py" variant-plan "$RUNNER_TEMP/work" "$step" > "$RUNNER_TEMP/out/bank-plan-$step.txt"
            while read -r label names; do
              [ -n "$label" ] || continue
              if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/bank/$label/tracking" $names --original-only 2>&1 | tee "$RUNNER_TEMP/out/bank-runner-$label.txt"; then
                python3 "$PHASE33/osc_bank.py" check-run "$RUNNER_TEMP/work" "$label"
              fi
            done < "$RUNNER_TEMP/out/bank-plan-$step.txt"
          done
          python3 "$PHASE33/osc_bank.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/osc-bank.json"
      - name: Ceiling-bank corners diagnostic (only when requested and reproduced)
        if: ${{ !cancelled() && inputs.ceiling_corners && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/ceiling_corners.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/ceiling-manifest.json"
          labels=$(python3 "$PHASE33/ceiling_corners.py" labels)
          [ -n "$labels" ] || { echo "::error::no ceiling_corners labels"; exit 1; }
          # Pinned entries first; e5lo / e5hi / e12hi and any pinned abort enter only the labelled variant ladder below.
          for label in $labels; do
            cases=$(python3 "$PHASE33/ceiling_corners.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: nothing pending"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/ceiling/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/ceiling-runner-$label.txt"; then
              python3 "$PHASE33/ceiling_corners.py" check-run "$RUNNER_TEMP/work" "$label"
            fi
          done
          for step in 1 2; do
            python3 "$PHASE33/ceiling_corners.py" variant-plan "$RUNNER_TEMP/work" "$step" > "$RUNNER_TEMP/out/ceiling-plan-$step.txt"
            while read -r label names; do
              [ -n "$label" ] || continue
              if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/ceiling/$label/tracking" $names --original-only 2>&1 | tee "$RUNNER_TEMP/out/ceiling-runner-$label.txt"; then
                python3 "$PHASE33/ceiling_corners.py" check-run "$RUNNER_TEMP/work" "$label"
              fi
            done < "$RUNNER_TEMP/out/ceiling-plan-$step.txt"
          done
          python3 "$PHASE33/ceiling_corners.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/ceiling-corners.json"
      - name: Pinned-versus-variant cross-check (only when requested and reproduced)
        if: ${{ !cancelled() && inputs.variant_cross_check && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/variant_cross_check.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/xcheck-manifest.json"
          labels=$(python3 "$PHASE33/variant_cross_check.py" labels)
          [ -n "$labels" ] || { echo "::error::no variant_cross_check labels"; exit 1; }
          # Each variant deck runs once; an abort is recorded (NOT FORMED), never retried.
          for label in $labels; do
            cases=$(python3 "$PHASE33/variant_cross_check.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: nothing pending"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/xcheck/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/xcheck-runner-$label.txt"; then
              python3 "$PHASE33/variant_cross_check.py" check-run "$RUNNER_TEMP/work" "$label"
            fi
          done
          python3 "$PHASE33/variant_cross_check.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/variant-cross-check.json"
      - name: Rshunt-free adv diagnostic (only when requested and reproduced)
        if: ${{ !cancelled() && inputs.adv_rshunt_free && steps.identity.outcome == 'success' }}
        run: |
          python3 "$PHASE33/adv_rshunt_free.py" prepare "$RUNNER_TEMP/work" --manifest "$RUNNER_TEMP/out/r10-manifest.json"
          labels=$(python3 "$PHASE33/adv_rshunt_free.py" labels)
          [ -n "$labels" ] || { echo "::error::no adv_rshunt_free labels"; exit 1; }
          # Each deck runs once; an abort is recorded, never retried.
          for label in $labels; do
            cases=$(python3 "$PHASE33/adv_rshunt_free.py" pending "$RUNNER_TEMP/work" "$label")
            if [ -z "$cases" ]; then echo "$label: nothing pending"; continue; fi
            if ! python3 "$PHASE33/run_ladder.py" "$RUNNER_TEMP/work/r10/$label/tracking" $cases --original-only 2>&1 | tee "$RUNNER_TEMP/out/r10-runner-$label.txt"; then
              python3 "$PHASE33/adv_rshunt_free.py" check-run "$RUNNER_TEMP/work" "$label"
            fi
          done
          python3 "$PHASE33/adv_rshunt_free.py" analyze "$RUNNER_TEMP/work" --output "$RUNNER_TEMP/out/adv-rshunt-free.json"
      - name: Collect evidence without vendor model bytes
        if: always()
        run: |
          python3 "$PHASE33/extract_reference.py" collect "$RUNNER_TEMP/work" --evidence "$RUNNER_TEMP/evidence" --extra-dir "$RUNNER_TEMP/out"
          cat "$RUNNER_TEMP/evidence/hashes.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phase33-d1-reference
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
