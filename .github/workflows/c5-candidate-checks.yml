# One branch-scoped, credential-free validation of the reviewed C2–C5 candidate.
# This workflow has no PR trigger, secrets, artifact upload or deploy step.
# It is not a replacement for a later authorized integration/cutover gate.
name: C2–C5 Candidate Checks (No Deploy)

on:
  push:
    branches:
      - codex/c5-catalog-navigation-20261117-01

concurrency:
  group: c5-candidate-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root-site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete candidate history without retained credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact reviewed source base and workflow-only delta
        run: |
          base=45d7d21f5cd146106fc6b2f33d320d0782ead2df
          test "$GITHUB_REF" = refs/heads/codex/c5-catalog-navigation-20261117-01
          git merge-base --is-ancestor "$base" HEAD
          unexpected=$(git diff --name-only "$base" HEAD | sed '/^\.github\/workflows\/c5-candidate-checks\.yml$/d')
          test -z "$unexpected" || { printf 'Unexpected source delta: %s\n' "$unexpected"; exit 1; }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned host router dependency
        run: python3 -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Install frozen root workspace
        run: pnpm install --frozen-lockfile
      - name: Root evidence, tests, site and deterministic generation
        run: pnpm b4push
      - name: Root component and model browser smoke
        run: pnpm test:model-viewer:browser
      - name: Six-category navigation and broad Board P search in Chrome
        run: pnpm test:site-navigation:browser
      - name: Installed package browser smoke
        run: pnpm exec zudo-circuit-doc check-browser

  led-docs:
    needs: root-site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install frozen root workspace
        run: pnpm install --frozen-lockfile
      - name: Verify unified authored-page replay
        run: python3 circuit/orchestration/campaigns/pd-led-20261117-integration/c5_dev_site.py
      - name: Verify same-repository P15 owner and LED consumer
        run: bash circuit/scripts/check-led-p15-reference.sh
      - name: LED docs, enclosure, model and publication gates
        run: pnpm --dir products/led-lamp b4push
      - name: LED browser smoke
        run: pnpm --dir products/led-lamp test:browser

  led-firmware:
    needs: led-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Host firmware and target-host tests
        run: make -C products/led-lamp/firmware/board-l/target host-test target-host-test
      - name: Install pinned ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi=15:13.2.rel1-2 \
            binutils-arm-none-eabi=2.42-1ubuntu1+23 \
            libnewlib-arm-none-eabi=4.4.0.20231231-2
          arm-none-eabi-gcc --version
      - name: Target image build and receipt
        run: |
          make -C products/led-lamp/firmware/board-l/target clean
          make -C products/led-lamp/firmware/board-l/target
          cat products/led-lamp/firmware/board-l/target/build/board-l-skeleton.receipt.json
      - name: Check raw image against receipt
        working-directory: products/led-lamp/firmware/board-l/target
        run: |
          arm-none-eabi-objcopy -O binary build/board-l-skeleton.elf build/identity-check.bin
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          image = Path('build/identity-check.bin').read_bytes()
          expected = json.loads(Path('build/board-l-skeleton.receipt.json').read_text())['artifacts']
          digest = hashlib.sha256(image).hexdigest()
          if len(image) != expected['loadable_image_bytes'] or digest != expected['loadable_image_sha256']:
              raise SystemExit('FAIL: raw binary differs from receipt hash/length')
          print(f'PASS: raw binary {len(image)} bytes, SHA256 {digest}')
          PYTHON
      - name: V72 cross-compile and incremental rebuild checks
        run: |
          make -C products/led-lamp/firmware/board-l/target v72-objects
          make -C products/led-lamp/firmware/board-l/target check-incremental
