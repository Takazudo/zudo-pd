# Offline validation of the frozen component contract for the zudo-pd
# Board P / Board B renewal and historical Board A: the canonical Python validator, its unit tests
# and self-tests, the cross-component routing/refusal forward tests, the
# schgen smoke test, schematic regen-idempotency + label-geometry checks
# for all boards, connectivity-baseline drift for all boards, the retained
# decision-lock contract, and installed-package/project regressions. No credentials,
# no network, no KiCad.
#
# This is the source of truth for component evidence; main-deploy.yml's
# build depends on the same project strict gate before package preparation,
# which is why all workflows pin Python 3.12.

name: Component spec skills

on:
  pull_request:
    paths:
      - 'readme.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/skills/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - 'circuit.config.ts'
      - 'circuit/**'
      - 'lefthook.yml'
      - 'scripts/mdx-format.sh'
      - 'scripts/schgen/**'
      # Inputs consumed by circuit/scripts/run-python-gates.sh beyond the shared
      # documentation paths: Board P 20 V NVM intent, B20 tests and retained
      # reports, the PD15 supply-capability report, phase33 analysis, export
      # freshness bindings and the fixed P15 package checks (traced; contract in circuit/tests/workflow-contract.test.ts).
      - 'scripts/pcb/**'
      - 'manufacturing/README.md'
      - 'manufacturing/package-notes-p15.md'
      - 'manufacturing/pd20-status.md'
      - 'manufacturing/power-budget.json'
      - 'manufacturing/power-budget.md'
      - 'manufacturing/power-budget-p15.json'
      - 'manufacturing/power-budget-b20.json'
      - 'manufacturing/supply-capability.json'
      - 'manufacturing/power-layout.json'
      - 'manufacturing/power-layout-b20.json'
      - 'manufacturing/releases/corner-support-review/**'
      - 'manufacturing/sim/board-b20-phase33/**'
      - 'manufacturing/sim/board-b20-phase7/ac/**'
      - 'boards/**'
      - 'symbols/**'
      - 'footprints/**'
      - 'doc/**'
  push:
    # main only: a push to a topic branch with an open PR already runs the
    # pull_request trigger, and the two land in different concurrency groups
    # (refs/heads/<topic> vs refs/pull/N/merge), so without this filter every
    # PR commit burns two full runs and tag pushes trigger a third.
    branches:
      - main
    paths:
      - 'readme.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/skills/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - 'circuit.config.ts'
      - 'circuit/**'
      - 'lefthook.yml'
      - 'scripts/mdx-format.sh'
      - 'scripts/schgen/**'
      # Inputs consumed by circuit/scripts/run-python-gates.sh beyond the shared
      # documentation paths: Board P 20 V NVM intent, B20 tests and retained
      # reports, the PD15 supply-capability report, phase33 analysis, export
      # freshness bindings and the fixed P15 package checks (traced; contract in circuit/tests/workflow-contract.test.ts).
      - 'scripts/pcb/**'
      - 'manufacturing/README.md'
      - 'manufacturing/package-notes-p15.md'
      - 'manufacturing/pd20-status.md'
      - 'manufacturing/power-budget.json'
      - 'manufacturing/power-budget.md'
      - 'manufacturing/power-budget-p15.json'
      - 'manufacturing/power-budget-b20.json'
      - 'manufacturing/supply-capability.json'
      - 'manufacturing/power-layout.json'
      - 'manufacturing/power-layout-b20.json'
      - 'manufacturing/releases/corner-support-review/**'
      - 'manufacturing/sim/board-b20-phase33/**'
      - 'manufacturing/sim/board-b20-phase7/ac/**'
      - 'boards/**'
      - 'symbols/**'
      - 'footprints/**'
      - 'doc/**'

concurrency:
  group: component-spec-skills-${{ github.ref }}
  # Superseded runs on a topic branch or PR carry no information. On main they
  # do — that run is the record for a commit that is already merged.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned to the same pins main-deploy.yml uses — a mutable tag is a
      # supply-chain hole, and two workflows on one runner image should not
      # disagree about which checkout/Python they get. Both SHAs verified
      # against the real tags (checkout v5.0.1, setup-python v5.6.0).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The shared P15 reference check verifies its recorded commits and reads the frozen package base.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the host router dependency
        # Same pin as board-p-r3-rebuild.yml; only the Board P r3 router regression imports it.
        run: python3 -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Project Python gates (shared with the local b4push)
        # One script owns the list so CI and `pnpm b4push` cannot drift apart:
        # strict component audit, integration forward tests, schgen tests,
        # regen idempotency, label geometry, baseline drift, decisions.json,
        # the P15 NVM image rebuild check and the footprint courtyard checks.
        run: bash circuit/scripts/run-python-gates.sh

  # The installed package, project host and compatibility regressions need
  # Node and Python, hence their own root-workspace job.
  doc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict project and package validation
        run: pnpm circuit:check
      - name: Retained circuit tests
        run: pnpm test:circuit
      - name: Installed package compatibility and declarations
        run: pnpm test:compatibility
      - name: Host, CAD and model checks
        run: pnpm check
