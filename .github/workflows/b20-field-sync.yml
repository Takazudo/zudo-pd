# Single-purpose B20 value-only field sync (readiness D11, #235).
# Applies a spec Value/LCSC change to the saved B20 PCB at the pinned KiCad 10.0.6 image, refills it twice
# in fresh processes, proves nothing but the named fields changed, and re-derives the hash-bound desk reports
# from the saved native copper. It never reroutes, re-places or changes a footprint.
# Output is an artifact for review; nothing is pushed. No secrets, no write permission, no deploy.

name: B20 field sync

on:
  workflow_dispatch:
    inputs:
      refs:
        description: Comma-separated reference designators expected to change
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: b20-field-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      IMAGE: kicad/kicad@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      PYTHONHASHSEED: '0'
      REFS: ${{ inputs.refs }}
      D: scripts/pcb/board-b20
      OUT: boards/board-b20-draft
    steps:
      # Same pins as component-spec-skills.yml (checkout v5.0.1, setup-python v5.6.0).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate the requested reference list
        run: |
          [[ "$REFS" =~ ^[A-Z][A-Z0-9]*(,[A-Z][A-Z0-9]*)*$ ]] || { echo "invalid refs: $REFS" >&2; exit 1; }
      - name: Preflight - projection and schematic match the spec
        run: |
          python3 scripts/schgen/gen_b20_components.py --check
          python3 scripts/schgen/gen_schematic.py scripts/schgen/board_b20_spec.py
          git diff --exit-code -- boards/board-b20-draft/board-b20-draft.kicad_sch
      - name: Pull the pinned KiCad image by digest
        run: docker pull "$IMAGE"
      - name: Sync fields, finalize, verify and re-derive reports
        id: sync
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/b20"; E="$RUNNER_TEMP/evidence"; mkdir -p "$T" "$E"
          run() { docker run --rm --platform linux/amd64 --cpus 1 --user 0 -e PYTHONHASHSEED -v "$PWD":"$PWD" -v "$T":"$T" -w "$PWD" "$IMAGE" \
            bash -c 'broadwayd :5 >/dev/null 2>&1 & sleep 1; GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 exec python3 "$@"' kicad-python "$@"; }
          cp "$OUT/board-b20-draft.kicad_pcb" "$T/before.kicad_pcb"
          cp "$OUT/report-input-receipt.json" "$T/report-template.json"
          run "$D/sync-fields.py" "$T/before.kicad_pcb" "$T/synced.kicad_pcb" "$REFS" | tee "$E/sync-fields.json"
          python3 "$D/finalize_refill.py" "$T/synced.kicad_pcb" "$OUT/board-b20-draft.kicad_pcb" \
            --project "$OUT/board-b20-draft.kicad_pro" --receipt "$OUT/refill-finalization.json"
          python3 "$D/verify-field-sync.py" "$T/before.kicad_pcb" "$OUT/board-b20-draft.kicad_pcb" "$REFS" "$E/field-sync-verification.json"
          run "$D/dump-geom.py" "$OUT/board-b20-draft.kicad_pcb" > "$T/final-geom.json"
          run "$D/read-routed-copper.py" "$OUT/board-b20-draft.kicad_pcb" "$T/report-template.json" "$T/final-geom.json" \
            "$T/final-routes.json" "$OUT/report-input-receipt.json"
          python3 "$D/loop-check.py" "$T/final-geom.json" "$T/final-routes.json" "$OUT/loop-check.json" > /dev/null
          python3 "$D/current-check.py" "$T/final-geom.json" "$T/final-routes.json" "$OUT/current-check.json" > /dev/null
          python3 "$D/thermal-check.py" "$OUT/thermal-check.json"
          python3 "$D/power-report.py"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); n=json.load(open(sys.argv[2])); assert (r["tracks"], r["vias"]) == (len(n["tracks"]), len(n["vias"])), "routing-report counts changed"' \
            "$OUT/routing-report.json" "$T/final-routes.json"
      - name: Collect changed files
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          E="$RUNNER_TEMP/evidence"; mkdir -p "$E"
          git status --porcelain --untracked-files=no | tee "$E/changed.txt"
          # Changed files are offered for adoption only when every check above passed.
          if [[ "$SYNC_OUTCOME" == success ]]; then
            echo PASS > "$E/status.txt"; mkdir -p "$E/files"
            git diff --name-only -z | xargs -0 -r -I{} cp --parents {} "$E/files/"
          else
            echo "FAILED: sync step outcome $SYNC_OUTCOME; no files offered" > "$E/status.txt"
          fi
          (cd "$E" && find . -type f ! -name hashes.txt -print0 | sort -z | xargs -0 sha256sum > hashes.txt)
          cat "$E/hashes.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: b20-field-sync
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
