# Pull request quality checks and preview deployment for the doc/ site.
#
# Triggered on PRs targeting `main` or any `base/**` worktree base branch (so
# topic PRs that target a base branch also get a preview), when the PR touches
# site sources, circuit configuration/evidence/CAD, the root workspace or a
# workflow. Pipeline: root strict checks -> retained project tests -> build ->
# publication/link/browser checks -> generated drift/idempotency -> Cloudflare
# preview alias -> route smoke test -> sticky PR comment.
#
# Every build, publication, strict link and project browser gate is credential-
# free and mandatory. Only preview upload and its route smoke need Cloudflare
# credentials.
#
# Secret gating: same readiness-step pattern as main-deploy.yml — the
# `secrets` context is not available in job-level `if:` expressions. Until
# CLOUDFLARE_API_TOKEN is set, the preview deploy is skipped with an explicit
# notice and the sticky comment falls back to "preview pending" text; the job
# stays GREEN, never red. A missing credential never skips a gate above it.
#
# Secrets:
#   CLOUDFLARE_API_TOKEN  — Workers: Edit scope
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
# (both already set — see doc/CLAUDE.md "Cloudflare Deploy (live)".)

name: PR Checks

on:
  pull_request:
    branches:
      - main
      - "base/**"
    paths:
      - "readme.md"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "patches/**"
      - "circuit.config.ts"
      - "circuit/**"
      - "doc/**"
      - ".claude/skills/**"
      - "boards/**"
      - "symbols/**"
      - "footprints/**"
      - "scripts/schgen/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "lefthook.yml"
      - "scripts/mdx-format.sh"
      - ".github/workflows/**"

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks-and-preview:
    name: Check and Preview Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Captures the build command's combined output separately from the
      # ZUDO_DOC_BUILD_LOG written by the root build wrapper for link checks.
      BUILD_LOG_NAME: build-output.log

    steps:
      # SHA-pinned like the other two workflows — a mutable tag is a
      # supply-chain hole, and three workflows on one runner image should not
      # disagree about which checkout/pnpm/node/python they get.
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # doc-history needs complete history to populate authored page metadata.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The project contract and generator require Python 3.12.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict project and package validation
        run: pnpm circuit:check

      - name: Host, CAD and model checks
        run: pnpm check

      - name: Retained circuit tests
        run: pnpm test:circuit

      - name: Installed package compatibility and declarations
        run: pnpm test:compatibility

      # The build log is written to a file rather than the console: it
      # carries ~2500+ zfb link warnings that are all false (see the next
      # step), and that volume of false lines is exactly what a real one
      # hides in. On failure the whole log is printed, so nothing is lost
      # when it matters.
      - name: Build site
        env:
          ZUDO_DOC_BUILD_LOG: ${{ runner.temp }}/doc-build.log
        run: |
          BUILD_LOG="$RUNNER_TEMP/$BUILD_LOG_NAME"
          if pnpm build >"$BUILD_LOG" 2>&1; then
            status=0
          else
            status=$?
          fi
          grep -v '^zfb warn: ' "$BUILD_LOG" || true
          if [ "$status" -ne 0 ]; then
            echo "::group::full build log"
            cat "$BUILD_LOG"
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Project model viewer browser smoke
        run: pnpm test:model-viewer:browser

      - name: Additional package browser smoke
        run: pnpm exec zudo-circuit-doc check-browser

      - name: Built publication, links and fragments
        env:
          ZUDO_DOC_BUILD_LOG: ${{ runner.temp }}/doc-build.log
        run: pnpm check:site

      - name: Generated output is committed and deterministic
        run: pnpm circuit:check-generated

      - name: Check secret readiness
        id: readiness
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview deploy skipped — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set."
          fi

      - name: Write dist/.assetsignore
        if: steps.readiness.outputs.ready == 'true'
        working-directory: doc
        # The adapter already writes this at build time; this defensive
        # rewrite guarantees the deploy excludes the worker bundle files
        # even if a future adapter version stops emitting it. Never committed.
        run: printf '%s\n' '_worker.js' '_zfb_inner.mjs' > dist/.assetsignore

      - name: Deploy PR preview to Cloudflare Workers
        id: cf-deploy
        if: steps.readiness.outputs.ready == 'true'
        working-directory: doc
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          ALIAS="pr-${PR_NUMBER}"
          # wrangler versions upload prints the stable preview-alias URL
          # (on *.workers.dev — requires workers_dev = true and
          # preview_urls = true in wrangler.toml) to stdout/stderr. Capture
          # both via tee and grep the alias URL line. Pinned to the same
          # `wrangler@4` main-deploy.yml uses — zudo-pd has no `wrangler` in
          # devDependencies to read a version from.
          DEPLOY_LOG=$(mktemp)
          npx wrangler@4 versions upload \
            --preview-alias "$ALIAS" \
            2>&1 | tee "$DEPLOY_LOG"
          # `|| true` is required: under GitHub Actions' default `bash -eo pipefail`,
          # grep finding no match makes this assignment's pipeline fail, which would
          # abort the script here (skipping the graceful "no URL yet" handling below)
          # instead of falling through to it.
          DEPLOY_URL=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1 || true)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          if [ -z "$DEPLOY_URL" ]; then
            # Non-fatal: the worker upload can succeed with no printed
            # preview-alias URL (e.g. workers.dev subdomain not enabled yet).
            echo "::warning::No preview-alias URL found in wrangler output. Worker upload succeeded."
            exit 0
          fi
          echo "Preview URL: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Gated on a returned URL, not on the deploy step succeeding: the
      # upload can succeed without printing a preview-alias URL, and
      # "verified" must mean a request was actually made and answered. One
      # representative route per generated page kind. Retried because a
      # fresh worker version can take a few seconds to answer on the alias.
      - name: Smoke-test component routes on the preview
        id: smoke
        if: steps.cf-deploy.outputs.deploy_url != ''
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        run: |
          # No trailing slash — that is the canonical form the pages link to
          # each other by, and [assets] html_handling defaults to
          # auto-trailing-slash, so `/docs/components/` would answer with a
          # redirect rather than a 200. `-L` follows one anyway, so this
          # stays a content check and not an assertion about URL
          # normalisation.
          routes="/docs/components /docs/components/catalog /docs/components/records/stusb4500qtr /docs/components/integration"
          for route in $routes; do
            url="${DEPLOY_URL}${route}"
            code=""
            for attempt in 1 2 3 4 5; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              if [ "$code" = "200" ]; then break; fi
              echo "attempt ${attempt}: ${url} -> ${code:-no response}"
              sleep 5
            done
            if [ "$code" != "200" ]; then
              echo "::error::${url} returned ${code:-no response}"
              exit 1
            fi
            echo "200  ${url}"
          done
          # A status code alone would still pass if the worker answered with
          # a rendered shell carrying no evidence. One exact MPN from the
          # record route makes the check non-vacuous — the same identity
          # built-site text check asserts on the rendered page.
          # Captured into a variable rather than piped into `grep -q`: under
          # this shell's `pipefail`, grep exiting on the first match kills
          # curl with SIGPIPE and the pipeline reports failure on a
          # SUCCESSFUL match.
          record="${DEPLOY_URL}/docs/components/records/stusb4500qtr"
          body=$(curl -sSL --max-time 20 "$record" || true)
          case "$body" in
            *STUSB4500QTR*) echo "content  STUSB4500QTR present on ${record}" ;;
            *)
              echo "::error::${record} answered 200 but does not carry the record's MPN"
              exit 1
              ;;
          esac
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
          ROUTES_VERIFIED: ${{ steps.smoke.outputs.verified }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const routesVerified = process.env.ROUTES_VERIFIED === 'true';
            const prNumber = context.issue.number;
            const marker = '<!-- cf-preview-pr -->';
            const sha = context.sha.substring(0, 7);

            // Only the smoke step's own output may claim verification — an
            // upload that returned a URL is not evidence the routes answer.
            const routeLine = routesVerified
              ? 'Component landing, catalog, record and integration routes answered 200 on this preview.'
              : 'Component routes were **not** smoke-tested on this preview.';

            const body = deployUrl
              ? [
                  marker,
                  `## Cloudflare Workers Preview`,
                  '',
                  `Preview deployment is ready.`,
                  '',
                  `| | URL |`,
                  `|---|---|`,
                  `| Preview | ${deployUrl} |`,
                  '',
                  routeLine,
                  '',
                  `Built from commit: \`${sha}\``,
                ].join('\n')
              : [
                  marker,
                  `## Cloudflare Workers Preview`,
                  '',
                  `⏳ **Preview pending.** No preview URL is available yet — this is expected until \`CLOUDFLARE_API_TOKEN\` / \`CLOUDFLARE_ACCOUNT_ID\` are configured, or the worker uploaded but wrangler printed no \`*.workers.dev\` alias URL.`,
                  '',
                  `Built from commit: \`${sha}\``,
                ].join('\n');

            // Look for an existing comment from this workflow to update in-place
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing preview comment (id: ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new preview comment');
            }
