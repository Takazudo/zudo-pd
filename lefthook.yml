# Repository policy: never use Git LFS or invoke its hooks.
skip_lfs: true

pre-commit:
  commands:
    format-mdx:
      glob: 'doc/src/content/docs/**/*.{md,mdx}'
      # Generated component-record pages (pnpm circuit:generate)
      # are byte-exact against the committed-output drift check. Formatting
      # them at commit time would drift them from the next circuit:prepare
      # run and turn CI red on every PR touching the tree.
      exclude: 'doc/src/content/docs/components/**'
      stage_fixed: true
      run: ./scripts/mdx-format.sh --write {staged_files}

pre-push:
  commands:
    b4push:
      run: |
        BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null)
        if [ "$BRANCH" = "main" ]; then
          echo "Running the guarded repository b4push gate before pushing to main..."
          pnpm b4push || exit 1
          echo "Repository quality gates passed!"
        fi
