# Repository policy: never use Git LFS or invoke its hooks.
skip_lfs: true

pre-commit:
  commands:
    format-mdx:
      glob: 'doc/src/content/docs/**/*.{md,mdx}'
      # Generated component pages and source-bound C5 development copies have
      # their own byte-exact drift checks; formatting at commit time changes
      # those outputs without changing their inputs.
      exclude:
        - 'doc/src/content/docs/components/**'
        - 'doc/src/content/docs/led-lamp/architecture/**'
        - 'doc/src/content/docs/led-lamp/getting-started/**'
        - 'doc/src/content/docs/led-lamp/how-to/**'
        - 'doc/src/content/docs/led-lamp/power/**'
        - 'doc/src/content/docs/led-lamp/research/**'
        - 'doc/src/content/docs/catalog/led-candidates.mdx'
        - 'doc/src/content/docs/catalog/lines.mdx'
        - 'doc/src/content/docs/catalog/review.mdx'
        - 'doc/src/content/docs/catalog/item-evidence.mdx'
      stage_fixed: true
      run: ./scripts/mdx-format.sh --write {staged_files}

pre-push:
  commands:
    b4push:
      run: |
        BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null)
        if [ "$BRANCH" = "main" ]; then
          echo "Running the guarded repository b4push gate before pushing to main..."
          pnpm b4push || exit 1
          echo "Repository quality gates passed!"
        fi
